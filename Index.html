<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Happy Birthday ❤️</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{touch-action:manipulation}

/* ==========================================================
   COUNTDOWN
   ========================================================== */

#countdown{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    overflow:hidden;
}

#bg-canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

#countText{
    position:relative;
    z-index:2;
    font-weight:900;
    font-size:clamp(64px,18vw,150px);
    letter-spacing:2px;
    text-align:center;
    color:#fff;
    text-shadow:
        0 0 10px #fff,
        0 0 28px #ff4fc3,
        0 0 60px #ff1493;
    animation:pop .75s ease;
}

@keyframes pop{
    0%{opacity:0;transform:scale(.55)}
    65%{opacity:1;transform:scale(1.08)}
    100%{transform:scale(1)}
}

/* ==========================================================
   MAIN SCENE — FULL SCREEN
   ========================================================== */

#birthdayScene{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000;
    overflow:hidden;
}

#space{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,40,180,.055),
            transparent 42%
        ),
        #000;
}

.star{
    position:absolute;
    width:1px;
    height:1px;
    background:#fff;
    border-radius:50%;
    opacity:.15;
}

/* ==========================================================
   FULL-SCREEN SCENE
   Không còn khung iPhone / notch / homebar.
   ========================================================== */

/* ==========================================================
   SCREEN

   QUAN TRỌNG:
   - perspective chỉ tạo độ sâu/kích thước
   - z CỐ ĐỊNH
   - y MỚI LÀ THỨ DI CHUYỂN
   => tất cả rơi TỪ TRÊN XUỐNG như video.
   ========================================================== */

.screen{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020207;
    perspective:900px;
    perspective-origin:50% 50%;
    transform-style:preserve-3d;
}

#falling{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:visible;
    transform-style:preserve-3d;
}

/* ==========================================================
   OBJECT BASE
   ========================================================== */

.item{
    position:absolute;
    left:0;
    top:0;
    white-space:nowrap;
    transform-style:preserve-3d;
    will-change:transform,opacity;
    user-select:none;
    pointer-events:none;
    backface-visibility:hidden;
}

/* ==========================================================
   TEXT
   ========================================================== */

.word{
    line-height:1;
    font-weight:500;

    text-shadow:
        0 0 5px currentColor,
        0 0 12px currentColor,
        0 0 27px currentColor,
        0 0 42px rgba(255,255,255,.22);
}

.small{font-size:13px}
.medium{font-size:20px}
.big{font-size:34px}
.huge{font-size:58px}

.white{color:#eafaff}
.blue{color:#d8f7ff}
.pink{color:#ff78d9}

/* ==========================================================
   HEART

   Tim trong video cũng rơi xuống.
   Không animate z.
   ========================================================== */

.heart{
    font-size:38px;
    line-height:1;
    color:#ff351d;

    text-shadow:
        0 0 5px #ff3a20,
        0 0 15px #ff2415,
        0 0 32px rgba(255,55,20,.55);
}

/* ==========================================================
   PHOTO

   Kích thước gốc nhỏ hơn, sau đó scale cố định theo depth.
   Một số ảnh được tạo rất lớn giống các frame 3 / 7 / 10.
   ========================================================== */

.photo{
    width:150px;
    height:205px;
    object-fit:cover;
    border:1px solid rgba(255,255,255,.65);
    border-radius:1px;

    box-shadow:
        0 0 12px rgba(255,255,255,.18),
        0 0 28px rgba(255,255,255,.08);
}

.photo.medium-photo{
    width:185px;
    height:250px;
}

.photo.large-photo{
    width:250px;
    height:350px;
}

.photo.hero-photo{
    width:315px;
    height:445px;
}

.message{
    position:absolute;
    bottom:4vh;
    left:50%;
    transform:translateX(-50%);
    z-index:50;
    width:90%;
    text-align:center;
    font-size:13px;
    opacity:.72;
    letter-spacing:1px;
    text-shadow:0 0 12px #ff45c7;
}
</style>
</head>

<body>

<section id="countdown">
    <canvas id="bg-canvas"></canvas>
    <div id="countText">3</div>
</section>

<section id="birthdayScene">

    <div id="space"></div>

    <div class="screen">
        <div id="falling"></div>
    </div>

    <div class="message">
        CHỈ MONG EM LUÔN HẠNH PHÚC ❤️
    </div>

</section>

<audio id="music" src="nhac.mp3" preload="auto"></audio>

<script>

/* ==========================================================
   COUNTDOWN
   ========================================================== */

const bg=document.getElementById("bg-canvas");
const ctx=bg.getContext("2d");

let W,H,cols,drops;

const matrixText="01101001HAPPYBIRTHDAY10101";

function resizeMatrix(){

    const dpr=Math.min(devicePixelRatio||1,2);

    bg.width=innerWidth*dpr;
    bg.height=innerHeight*dpr;

    ctx.setTransform(dpr,0,0,dpr,0,0);

    W=innerWidth;
    H=innerHeight;

    cols=Math.floor(W/15);

    drops=Array(cols)
        .fill(0)
        .map(()=>Math.random()*-30);
}

resizeMatrix();
addEventListener("resize",resizeMatrix);

function matrix(){

    ctx.fillStyle="rgba(0,0,0,.13)";
    ctx.fillRect(0,0,W,H);

    ctx.font="13px monospace";

    for(let i=0;i<cols;i++){

        const ch=
            matrixText[
                (Math.random()*matrixText.length)|0
            ];

        ctx.fillStyle=
            Math.random()<.08
            ? "#fff"
            : "#ff58c8";

        ctx.fillText(
            ch,
            i*15,
            drops[i]*15
        );

        if(
            drops[i]*15>H &&
            Math.random()>.975
        ){
            drops[i]=0;
        }

        drops[i]+=.55;
    }

    requestAnimationFrame(matrix);
}

matrix();


const countText=document.getElementById("countText");

const sequence=[
    "3",
    "2",
    "1",
    "HAPPY",
    "BIRTHDAY",
    "TO",
    "CỤC TÂM ❤️"
];

let si=0;

function nextCount(){

    if(si>=sequence.length){

        startBirthday();
        return;
    }

    countText.style.animation="none";
    void countText.offsetWidth;
    countText.style.animation="pop .75s ease";

    countText.textContent=sequence[si++];

    setTimeout(
        nextCount,
        sequence[si-1].length>2
            ?850
            :900
    );
}

setTimeout(nextCount,400);


/* ==========================================================
   FALLING SCENE
   ========================================================== */

const birthdayScene=
    document.getElementById("birthdayScene");

const falling=
    document.getElementById("falling");


/* Nội dung lấy theo phong cách xuất hiện trong video */
const WORDS=[
    "Mãi xinh đẹp",
    "Luôn mỉm cười",
    "Rạng rỡ và hạnh phúc",
    "Cục Tâm ♥",
    "Yêu em",
    "Sinh nhật vui vẻ",
    "Rạng rỡ và hạnh phúc",
    "Mãi xinh đẹp",
    "Cục Tâm",
    "Luôn mỉm cười",
    "Sinh nhật vui vẻ"
];

const HEARTS=[
    "♥",
    "❤",
    "♡"
];

let objects=[];


/* ==========================================================
   THÔNG SỐ QUAN TRỌNG
   ========================================================== */

const CONFIG={

    /*
     * Mật độ:
     * Video rất dày, nhưng không phải tất cả cùng một kích thước.
     */
    words:80,
    hearts:15,
    photos:9,

    /*
     * Chiều sâu chỉ quyết định kích thước/độ sáng.
     * KHÔNG dùng z để di chuyển.
     */
    minZ:-500,
    maxZ:430,

    perspective:900
};


/* ==========================================================
   RANDOM HELPERS
   ========================================================== */

function rnd(a,b){
    return a+Math.random()*(b-a);
}

function pick(arr){
    return arr[(Math.random()*arr.length)|0];
}


/* ==========================================================
   DEPTH

   Đây là điểm khác biệt lớn so với code trước:

   z KHÔNG tăng theo thời gian.

   Mỗi object có một "vị trí trong không gian" cố định.
   Nó chỉ rơi theo trục Y.

   => nhìn giống video: vật thể từ phía trên đi xuống.
   ========================================================== */

function depthInfo(z){

    const k=
        (z-CONFIG.minZ)/
        (CONFIG.maxZ-CONFIG.minZ);

    const n=Math.max(0,Math.min(1,k));

    /*
     * Xa:
     *   nhỏ
     *   hơi mờ
     *
     * Gần:
     *   rất lớn
     *   sáng
     */
    const scale=
        .48+
        Math.pow(n,1.45)*1.72;

    const opacity=
        .38+
        n*.57;

    return {
        scale,
        opacity
    };
}


/* ==========================================================
   TEXT
   ========================================================== */

function addWord(initial=true){

    const e=document.createElement("div");

    const r=Math.random();

    let sizeClass;

    /*
     * Phần lớn là chữ nhỏ/trung bình.
     * Một số chữ lớn giống các frame trong video.
     */
    if(r<.035){
        sizeClass="huge";
    }
    else if(r<.22){
        sizeClass="big";
    }
    else if(r<.72){
        sizeClass="medium";
    }
    else{
        sizeClass="small";
    }

    /*
     * Video có nhiều trắng/cyan lúc đầu.
     * Sau đó có pink.
     */
    const colorClass=
        Math.random()<.18
        ? "pink"
        : Math.random()<.5
            ? "blue"
            : "white";

    e.className=
        "item word "+
        sizeClass+" "+
        colorClass;

    e.textContent=pick(WORDS);

    falling.appendChild(e);


    const o={

        e:e,
        type:"word",

        /*
         * X gần như cố định trong một lần rơi.
         */
        x:rnd(-12,112),

        /*
         * Đây là TRỤC RƠI.
         */
        y:rnd(-115,108),

        /*
         * Depth CỐ ĐỊNH.
         */
        z:rnd(
            CONFIG.minZ,
            CONFIG.maxZ
        ),

        /*
         * tốc độ rơi px / giây
         */
        speed:rnd(42,88),

        /*
         * chuyển động ngang rất nhỏ.
         * Chỉ để giống video, không phải bay ra ngoài.
         */
        drift:rnd(-2.5,2.5),

        phase:rnd(0,Math.PI*2),

        /*
         * Góc của từng chữ CỐ ĐỊNH.
         * Video không có cảm giác object xoay liên tục.
         */
        rx:rnd(-3.5,3.5),
        ry:rnd(-7,7),
        rz:rnd(-4,4),

        /*
         * depth scale CỐ ĐỊNH.
         */
        depth:depthInfo(0),

        alpha:rnd(.75,1)
    };


    o.depth=depthInfo(o.z);


    if(initial){

        /*
         * Phân bố sẵn toàn màn hình ở frame đầu.
         */
        o.y=rnd(-115,112);
    }


    objects.push(o);
}


/* ==========================================================
   HEART
   ========================================================== */

function addHeart(initial=true){

    const e=document.createElement("div");

    e.className="item heart";
    e.textContent=pick(HEARTS);

    falling.appendChild(e);


    const o={

        e:e,
        type:"heart",

        x:rnd(-10,110),
        y:rnd(-125,108),

        /*
         * Depth cố định.
         */
        z:rnd(-420,420),

        /*
         * Tim trong video có tốc độ rơi khá nhanh.
         */
        speed:rnd(70,125),

        drift:rnd(-3,3),

        phase:rnd(0,Math.PI*2),

        rx:rnd(-4,4),
        ry:rnd(-8,8),
        rz:rnd(-5,5),

        depth:null,
        alpha:rnd(.8,1)
    };

    o.depth=depthInfo(o.z);

    objects.push(o);
}


/* ==========================================================
   PHOTO
   ========================================================== */

function addPhoto(n,initial=true){

    const e=document.createElement("img");

    e.className="item photo";

    e.src="images/"+n+".jpg";

    e.onerror=()=>{
        e.remove();
    };


    /*
     * Tỷ lệ ảnh trong video thay đổi rất mạnh.
     */
    const r=Math.random();

    if(r<.12){
        e.classList.add("hero-photo");
    }
    else if(r<.38){
        e.classList.add("large-photo");
    }
    else if(r<.70){
        e.classList.add("medium-photo");
    }


    falling.appendChild(e);


    const o={

        e:e,
        type:"photo",

        x:rnd(4,88),
        y:rnd(-135,108),

        /*
         * ảnh cũng chỉ RƠI Y.
         */
        z:rnd(-300,430),

        /*
         * ảnh chậm hơn chữ.
         */
        speed:rnd(30,55),

        drift:rnd(-1.8,1.8),

        phase:rnd(0,Math.PI*2),

        rx:rnd(-2.5,2.5),
        ry:rnd(-5,5),
        rz:rnd(-2.5,2.5),

        depth:null,
        alpha:rnd(.82,1)
    };

    o.depth=depthInfo(o.z);

    objects.push(o);
}


/* ==========================================================
   BUILD INITIAL DENSITY
   ========================================================== */

for(let i=0;i<CONFIG.words;i++){
    addWord(true);
}

for(let i=0;i<CONFIG.hearts;i++){
    addHeart(true);
}

for(let i=1;i<=CONFIG.photos;i++){
    addPhoto(i,true);
}


/* ==========================================================
   RECYCLE

   Object đi xuống đáy -> quay lại trên đỉnh.

   Không reset z để tránh cảm giác "bay từ trong ra ngoài".
   ========================================================== */

function recycle(o){

    o.y=rnd(-145,-25);

    o.x=rnd(-12,112);

    /*
     * Depth mới chỉ khi tái xuất hiện.
     * Trong suốt một lần rơi depth không thay đổi.
     */
    o.z=
        o.type==="photo"
        ?rnd(-300,430)
        :rnd(CONFIG.minZ,CONFIG.maxZ);

    o.depth=depthInfo(o.z);

    if(o.type==="word"){

        o.speed=rnd(42,88);
        o.drift=rnd(-2.5,2.5);
        o.alpha=rnd(.72,1);

    }
    else if(o.type==="heart"){

        o.speed=rnd(70,125);
        o.drift=rnd(-3,3);
        o.alpha=rnd(.82,1);

    }
    else{

        o.speed=rnd(30,55);
        o.drift=rnd(-1.8,1.8);
        o.alpha=rnd(.82,1);
    }
}


/* ==========================================================
   ANIMATION

   CHỈ:
       y += speed * dt

   KHÔNG:
       z += speed

   Đây là sửa lỗi chính của phiên bản trước.
   ========================================================== */

let last=performance.now();

function animate(t){

    const dt=
        Math.min(
            .032,
            (t-last)/1000
        );

    last=t;


    for(const o of objects){

        /*
         * ============================
         * 1. RƠI THẲNG TỪ TRÊN XUỐNG
         * ============================
         */
        o.y+=o.speed*dt;


        /*
         * ============================
         * 2. LỆCH NGANG RẤT NHẸ
         * ============================
         */
        o.x+=
            Math.sin(
                t*.00065+
                o.phase
            )*
            o.drift*
            dt;


        /*
         * ============================
         * 3. DEPTH CỐ ĐỊNH
         * ============================
         *
         * Không cập nhật o.z ở đây.
         */
        const d=o.depth;


        /*
         * ============================
         * 4. VỊ TRÍ
         * ============================
         */
        const x=
            o.x/100*
            falling.clientWidth;

        const y=
            o.y/100*
            falling.clientHeight;


        /*
         * ============================
         * 5. RENDER
         * ============================
         */
        o.e.style.opacity=
            o.alpha*
            d.opacity;


        o.e.style.transform=
            `
            translate3d(
                ${x}px,
                ${y}px,
                ${o.z}px
            )
            translate(-50%,-50%)
            rotateX(${o.rx}deg)
            rotateY(${o.ry}deg)
            rotateZ(${o.rz}deg)
            scale(${d.scale})
            `;


        /*
         * ============================
         * 6. RƠI KHỎI ĐÁY
         * ============================
         */
        if(o.y>120){

            recycle(o);
        }
    }


    requestAnimationFrame(animate);
}


/* ==========================================================
   STARS
   ========================================================== */

function buildScene(){

    const space=
        document.getElementById("space");

    for(let i=0;i<95;i++){

        const s=
            document.createElement("i");

        s.className="star";

        s.style.left=
            Math.random()*100+"%";

        s.style.top=
            Math.random()*100+"%";

        s.style.opacity=
            rnd(.10,.42);

        space.appendChild(s);
    }
}


/* ==========================================================
   START
   ========================================================== */

function startBirthday(){

    document
        .getElementById("countdown")
        .style.display="none";

    birthdayScene.style.display="flex";

    buildScene();

    last=performance.now();

    requestAnimationFrame(animate);


    const music=
        document.getElementById("music");

    music.play().catch(()=>{});
}


/* ==========================================================
   MOBILE AUDIO
   ========================================================== */

document.addEventListener(
    "pointerdown",
    ()=>{
        const music=
            document.getElementById("music");

        if(music.paused){
            music.play().catch(()=>{});
        }
    }
);

</script>

</body>
</html>
