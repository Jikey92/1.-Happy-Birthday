<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Happy Birthday ❤️</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{touch-action:manipulation}

/* ==========================================================
   COUNTDOWN
   ========================================================== */

#countdown{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    overflow:hidden;
}

#bg-canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

#countText{
    position:relative;
    z-index:2;
    font-weight:900;
    font-size:clamp(64px,18vw,150px);
    letter-spacing:2px;
    text-align:center;
    color:#fff;
    text-shadow:
        0 0 10px #fff,
        0 0 28px #ff4fc3,
        0 0 60px #ff1493;
    animation:pop .75s ease;
}

@keyframes pop{
    0%{opacity:0;transform:scale(.55)}
    65%{opacity:1;transform:scale(1.08)}
    100%{transform:scale(1)}
}

/* ==========================================================
   MAIN SCENE — FULL SCREEN
   ========================================================== */

#birthdayScene{
    position:fixed;
    inset:0;
    width:100vw;
    height:100dvh;
    min-height:100vh;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000;
    overflow:hidden;
    isolation:isolate;
}

#space{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,40,180,.055),
            transparent 42%
        ),
        #000;
}

.star{
    position:absolute;
    width:1px;
    height:1px;
    background:#fff;
    border-radius:50%;
    opacity:.15;
}

/* ==========================================================
   FULL-SCREEN SCENE
   Không còn khung iPhone / notch / homebar.
   ========================================================== */

/* ==========================================================
   SCREEN

   QUAN TRỌNG:
   - perspective chỉ tạo độ sâu/kích thước
   - z CỐ ĐỊNH
   - y MỚI LÀ THỨ DI CHUYỂN
   => tất cả rơi TỪ TRÊN XUỐNG như video.
   ========================================================== */

.screen{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020207;
    perspective:900px;
    perspective-origin:50% 50%;
    transform-style:preserve-3d;
}

#falling{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:visible;
    transform-style:preserve-3d;
    pointer-events:none;
}

/* ==========================================================
   OBJECT BASE
   ========================================================== */

.item{
    position:absolute;
    left:0;
    top:0;
    white-space:nowrap;
    transform-style:preserve-3d;
    will-change:transform,opacity;
    user-select:none;
    pointer-events:none;
    backface-visibility:hidden;
}

/* ==========================================================
   TEXT
   ========================================================== */

.word{
    line-height:1;
    font-weight:500;

    text-shadow:
        0 0 5px currentColor,
        0 0 12px currentColor,
        0 0 27px currentColor,
        0 0 42px rgba(255,255,255,.22);
}

.small{font-size:13px}
.medium{font-size:20px}
.big{font-size:34px}
.huge{font-size:58px}

.white{color:#eafaff}
.blue{color:#d8f7ff}
.pink{color:#ff78d9}

/* ==========================================================
   HEART

   Tim trong video cũng rơi xuống.
   Không animate z.
   ========================================================== */

.heart{
    font-size:38px;
    line-height:1;
    color:#ff351d;

    text-shadow:
        0 0 5px #ff3a20,
        0 0 15px #ff2415,
        0 0 32px rgba(255,55,20,.55);
}

/* ==========================================================
   PHOTO

   Kích thước gốc nhỏ hơn, sau đó scale cố định theo depth.
   Một số ảnh được tạo rất lớn giống các frame 3 / 7 / 10.
   ========================================================== */

.photo{
    width:150px;
    height:205px;
    object-fit:cover;
    border:1px solid rgba(255,255,255,.65);
    border-radius:1px;

    box-shadow:
        0 0 12px rgba(255,255,255,.18),
        0 0 28px rgba(255,255,255,.08);
}

.photo.medium-photo{
    width:185px;
    height:250px;
}

.photo.large-photo{
    width:250px;
    height:350px;
}

.photo.hero-photo{
    width:315px;
    height:445px;
}

.message{
    position:absolute;
    bottom:4vh;
    left:50%;
    transform:translateX(-50%);
    z-index:50;
    width:90%;
    text-align:center;
    font-size:13px;
    opacity:.72;
    letter-spacing:1px;
    text-shadow:0 0 12px #ff45c7;
}

/* ==========================================================
   START BUTTON — iPhone / Safari / GitHub Pages
   ========================================================== */

#startBtn{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:300;

    min-width:150px;
    min-height:64px;
    padding:12px 22px;

    border:1px solid rgba(255,255,255,.55);
    border-radius:18px;

    background:rgba(12,8,18,.80);
    color:#fff;

    font:600 16px/1.1 Arial,sans-serif;
    letter-spacing:.5px;

    box-shadow:0 0 28px rgba(255,90,210,.25);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
}

#startBtn span{
    display:block;
    font-size:24px;
    margin-bottom:5px;
}

#startBtn b{
    display:block;
}

#startBtn small{
    display:block;
    margin-top:5px;
    font-size:10px;
    font-weight:400;
    opacity:.68;
}

#startBtn:active{
    transform:translate(-50%,-50%) scale(.97);
}

@media (max-width:600px){
    #startBtn{
        min-width:145px;
        min-height:60px;
        border-radius:16px;
    }
}

</style>
</head>

<body>

<section id="countdown">
    <canvas id="bg-canvas"></canvas>
    <div id="countText">3</div>
</section>

<section id="birthdayScene">

    <div id="space"></div>

    <div class="screen">
        <div id="falling"></div>
    </div>

    <div class="message">
        CHỈ MONG EM LUÔN HẠNH PHÚC ❤️
    </div>

</section>

<audio id="music" src="nhac.mp3" preload="auto" loop playsinline></audio>

<button id="startBtn" type="button">
    <span>🎵</span>
    <b>BẮT ĐẦU</b>
    <small>Chạm để bật nhạc</small>
</button>

<script>

/* ==========================================================
   COUNTDOWN
   ========================================================== */

const bg=document.getElementById("bg-canvas");
const ctx=bg.getContext("2d");

let W,H,cols,drops;

const matrixText="01101001HAPPYBIRTHDAY10101";

function resizeMatrix(){

    const dpr=Math.min(devicePixelRatio||1,2);

    bg.width=innerWidth*dpr;
    bg.height=innerHeight*dpr;

    ctx.setTransform(dpr,0,0,dpr,0,0);

    W=innerWidth;
    H=innerHeight;

    cols=Math.floor(W/15);

    drops=Array(cols)
        .fill(0)
        .map(()=>Math.random()*-30);
}

resizeMatrix();
addEventListener("resize",resizeMatrix);

function matrix(){

    ctx.fillStyle="rgba(0,0,0,.13)";
    ctx.fillRect(0,0,W,H);

    ctx.font="13px monospace";

    for(let i=0;i<cols;i++){

        const ch=
            matrixText[
                (Math.random()*matrixText.length)|0
            ];

        ctx.fillStyle=
            Math.random()<.08
            ? "#fff"
            : "#ff58c8";

        ctx.fillText(
            ch,
            i*15,
            drops[i]*15
        );

        if(
            drops[i]*15>H &&
            Math.random()>.975
        ){
            drops[i]=0;
        }

        drops[i]+=.55;
    }

    requestAnimationFrame(matrix);
}

matrix();


const countText=document.getElementById("countText");

const sequence=[
    "3",
    "2",
    "1",
    "HAPPY",
    "BIRTHDAY",
    "TO",
    "CỤC TÂM ❤️"
];

let si=0;

function nextCount(){

    if(si>=sequence.length){

        startBirthday();
        return;
    }

    countText.style.animation="none";
    void countText.offsetWidth;
    countText.style.animation="pop .75s ease";

    countText.textContent=sequence[si++];

    setTimeout(
        nextCount,
        sequence[si-1].length>2
            ?850
            :900
    );
}




/* ==========================================================
   FALLING SCENE
   ========================================================== */

const birthdayScene=
    document.getElementById("birthdayScene");

const falling=
    document.getElementById("falling");


/* Nội dung lấy theo phong cách xuất hiện trong video */
/* ==========================================================
   USER SETTINGS — CHỈNH Ở ĐÂY
   ========================================================== */

/* Chữ tùy ý */
const WORDS = [
    "Mãi xinh đẹp",
    "Luôn mỉm cười",
    "Rạng rỡ và hạnh phúc",
    "Cục Tâm ♥",
    "Yêu em",
    "Sinh nhật vui vẻ",
    "Rạng rỡ và hạnh phúc",
    "Mãi xinh đẹp",
    "Cục Tâm",
    "Luôn mỉm cười",
    "Sinh nhật vui vẻ"
];

/* Tim/emoji tùy ý */
const HEARTS = ["♥", "❤", "♡"];

/*
 * ẢNH TÙY Ý:
 * Chỉ cần upload ảnh vào GitHub rồi ghi đúng đường dẫn ở đây.
 *
 * Ví dụ:
 * "images/1.jpg"
 * "images/anh-cua-em.png"
 * "photos/abc.webp"
 */
const IMAGE_SOURCES = [
    "images/1.jpg",
    "images/2.jpg",
    "images/3.jpg",
    "images/4.jpg",
    "images/5.jpg",
    "images/6.jpg",
    "images/7.jpg",
    "images/8.jpg",
    "images/9.jpg"
];

/*
 * NHẠC TÙY Ý:
 * Upload file nhạc vào GitHub rồi đổi đường dẫn tại đây.
 *
 * Ví dụ:
 * "nhac.mp3"
 * "music/bai-hat.mp3"
 */
const MUSIC_FILE = "nhac.mp3";

/*
 * MẬT ĐỘ / TỐC ĐỘ
 * Tất cả chữ + ảnh + tim dùng chung một hệ thống object.
 */
const CONFIG = {
    words: 105,
    hearts: 15,

    minZ: -500,
    maxZ: 430,

    /* px/giây */
    wordSpeed: [42, 88],
    heartSpeed: [70, 125],
    photoSpeed: [30, 55]
};

const objects = [];


/* ==========================================================
   RANDOM
   ========================================================== */

function rnd(a,b){
    return a + Math.random() * (b-a);
}

function pick(arr){
    return arr[(Math.random()*arr.length)|0];
}


/* ==========================================================
   CHIỀU SÂU Z — DÙNG CHUNG CHO CHỮ / ẢNH / TIM
   ========================================================== */

function depthInfo(z){

    const k =
        (z-CONFIG.minZ) /
        (CONFIG.maxZ-CONFIG.minZ);

    const n = Math.max(0, Math.min(1,k));

    /*
     * Xa  -> nhỏ + mờ
     * Gần -> lớn + sáng
     */
    return {
        scale: .9 + Math.pow(n,1.45)*1.1,
        opacity: 9 + n*.3
    };
}


/* ==========================================================
   CHỮ
   ========================================================== */

function addWord(){

    const e = document.createElement("div");

    const r = Math.random();

    let sizeClass;

    if(r < .035) sizeClass = "huge";
    else if(r < .22) sizeClass = "big";
    else if(r < .72) sizeClass = "medium";
    else sizeClass = "small";

    const colorClass =
        Math.random() < .18
        ? "pink"
        : Math.random() < .5
            ? "blue"
            : "white";

    e.className = "item word " + sizeClass + " " + colorClass;
    e.textContent = pick(WORDS);

    falling.appendChild(e);

    const o = {
        e,
        type: "word",

        x: rnd(-12,112),
        y: rnd(-115,108),

        /* Z cố định trong suốt một lần rơi */
        z: rnd(CONFIG.minZ,CONFIG.maxZ),

        speed: rnd(...CONFIG.wordSpeed),
        drift: rnd(-2.5,2.5),
        phase: rnd(0,Math.PI*2),

        rx: rnd(-3.5,3.5),
        ry: rnd(-7,7),
        rz: rnd(-4,4),

        alpha: rnd(.75,1)
    };

    o.depth = depthInfo(o.z);
    objects.push(o);
}


/* ==========================================================
   TIM
   ========================================================== */

function addHeart(){

    const e = document.createElement("div");

    e.className = "item heart";
    e.textContent = pick(HEARTS);

    falling.appendChild(e);

    const o = {
        e,
        type: "heart",

        x: rnd(-10,110),
        y: rnd(-125,108),

        /* Cùng hệ Z với chữ và ảnh */
        z: rnd(CONFIG.minZ,CONFIG.maxZ),

        speed: rnd(...CONFIG.heartSpeed),
        drift: rnd(-3,3),
        phase: rnd(0,Math.PI*2),

        rx: rnd(-4,4),
        ry: rnd(-8,8),
        rz: rnd(-5,5),

        alpha: rnd(.8,1)
    };

    o.depth = depthInfo(o.z);
    objects.push(o);
}


/* ==========================================================
   ẢNH
   ========================================================== */

function addPhoto(src){

    const e = document.createElement("img");

    e.className = "item photo";
    e.src = src;
    e.alt = "";

    /*
     * Ảnh sai tên sẽ không làm hỏng toàn bộ animation.
     */
    e.onerror = () => e.remove();

    /*
     * Kích thước GỐC.
     * Sau đó Z sẽ scale ảnh:
     * xa -> nhỏ
     * gần -> lớn
     */
    const r = Math.random();

    if(r < .12){
        e.classList.add("hero-photo");
    }
    else if(r < .38){
        e.classList.add("large-photo");
    }
    else if(r < .70){
        e.classList.add("medium-photo");
    }

    falling.appendChild(e);

    const o = {
        e,
        type: "photo",

        x: rnd(4,88),
        y: rnd(-135,108),

        /* Ảnh dùng chính hệ Z */
        z: rnd(CONFIG.minZ,CONFIG.maxZ),

        speed: rnd(...CONFIG.photoSpeed),
        drift: rnd(-1.8,1.8),
        phase: rnd(0,Math.PI*2),

        rx: rnd(-2.5,2.5),
        ry: rnd(-5,5),
        rz: rnd(-2.5,2.5),

        alpha: rnd(.82,1)
    };

    o.depth = depthInfo(o.z);
    objects.push(o);
}


/* ==========================================================
   KHỞI TẠO MẬT ĐỘ
   ========================================================== */

for(let i=0;i<CONFIG.words;i++){
    addWord();
}

for(let i=0;i<CONFIG.hearts;i++){
    addHeart();
}

for(const src of IMAGE_SOURCES){
    addPhoto(src);
}


/* ==========================================================
   RECYCLE — RƠI XUỐNG ĐÁY RỒI XUẤT HIỆN LẠI TỪ TRÊN
   ========================================================== */

function recycle(o){

    o.y = rnd(-145,-25);
    o.x = rnd(-12,112);

    /*
     * Z chỉ thay đổi khi object bắt đầu một vòng rơi mới.
     * Trong một vòng rơi, Z không đổi.
     */
    o.z = rnd(CONFIG.minZ,CONFIG.maxZ);
    o.depth = depthInfo(o.z);

    if(o.type === "word"){
        o.speed = rnd(...CONFIG.wordSpeed);
        o.drift = rnd(-2.5,2.5);
        o.alpha = rnd(.72,1);
    }
    else if(o.type === "heart"){
        o.speed = rnd(...CONFIG.heartSpeed);
        o.drift = rnd(-3,3);
        o.alpha = rnd(.82,1);
    }
    else{
        o.speed = rnd(...CONFIG.photoSpeed);
        o.drift = rnd(-1.8,1.8);
        o.alpha = rnd(.82,1);
    }
}


/* ==========================================================
   ANIMATION — MỘT HỆ THỐNG CHUNG
   ========================================================== */

let last = performance.now();

function animate(t){

    const dt = Math.min(.032,(t-last)/1000);
    last = t;

    for(const o of objects){

        /*
         * CHỈ Y DI CHUYỂN.
         * Vì vậy chữ + ảnh + tim đều rơi từ trên xuống.
         */
        o.y += o.speed * dt;

        /* Lệch ngang cực nhẹ */
        o.x +=
            Math.sin(t*.00065 + o.phase) *
            o.drift * dt;

        const d = o.depth;

        const x =
            o.x/100 *
            falling.clientWidth;

        const y =
            o.y/100 *
            falling.clientHeight;

        o.e.style.opacity =
            o.alpha * d.opacity;

        /*
         * CÙNG MỘT CÔNG THỨC:
         *
         * Z      = chiều sâu
         * scale  = xa nhỏ / gần lớn
         * Y      = hướng rơi
         */
        o.e.style.transform = `
            translate3d(${x}px,${y}px,${o.z}px)
            translate(-50%,-50%)
            rotateX(${o.rx}deg)
            rotateY(${o.ry}deg)
            rotateZ(${o.rz}deg)
            scale(${d.scale})
        `;

        if(o.y > 120){
            recycle(o);
        }
    }

    requestAnimationFrame(animate);
}


/* ==========================================================
   STARS
   ========================================================== */

function buildScene(){

    const space = document.getElementById("space");

    if(space.dataset.ready) return;
    space.dataset.ready = "1";

    for(let i=0;i<95;i++){

        const s = document.createElement("i");

        s.className = "star";
        s.style.left = Math.random()*100 + "%";
        s.style.top = Math.random()*100 + "%";
        s.style.opacity = rnd(.10,.42);

        space.appendChild(s);
    }
}


/* ==========================================================
   START BIRTHDAY
   ========================================================== */

function startBirthday(){

    document.getElementById("countdown").style.display = "none";
    birthdayScene.style.display = "flex";

    buildScene();

    last = performance.now();
    requestAnimationFrame(animate);
}


/* ==========================================================
   GITHUB PAGES + IPHONE AUDIO
   ========================================================== */

const music = document.getElementById("music");
const startBtn = document.getElementById("startBtn");

music.src = MUSIC_FILE;

let started = false;

async function startExperience(){

    if(started) return;

    started = true;

    /*
     * play() được gọi ngay trong thao tác chạm/click.
     * Đây là cách phù hợp với autoplay policy của iPhone/Safari.
     */
    music.volume = .72;

    try{
        await music.play();
    }
    catch(err){
        console.warn("Audio playback blocked:",err);
    }

    startBtn.style.display = "none";

    /* Bắt đầu countdown sau khi người dùng chạm */
    nextCount();
}

startBtn.addEventListener(
    "click",
    startExperience,
    {passive:true}
);

startBtn.addEventListener(
    "touchend",
    e=>{
        e.preventDefault();
        startExperience();
    },
    {passive:false}
);

/*
 * Không tự động chạy countdown nữa.
 * Người dùng phải chạm BẮT ĐẦU.
 */

</script>

</body>
</html>
