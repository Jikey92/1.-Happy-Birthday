<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Happy Birthday ❤️</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{touch-action:manipulation}

/* ==========================================================
   COUNTDOWN
   ========================================================== */

#countdown{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    overflow:hidden;
}

#bg-canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

#countText{
    position:relative;
    z-index:2;
    font-weight:900;
    font-size:clamp(64px,18vw,150px);
    letter-spacing:2px;
    text-align:center;
    color:#fff;
    text-shadow:
        0 0 10px #fff,
        0 0 28px #ff4fc3,
        0 0 60px #ff1493;
    animation:pop .75s ease;
}

@keyframes pop{
    0%{opacity:0;transform:scale(.55)}
    65%{opacity:1;transform:scale(1.08)}
    100%{transform:scale(1)}
}

/* ==========================================================
   MAIN SCENE — FULL SCREEN
   ========================================================== */

#birthdayScene{
    position:fixed;
    inset:0;
    width:100vw;
    height:100dvh;
    min-height:100vh;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000;
    overflow:hidden;
    isolation:isolate;
}

#space{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,40,180,.055),
            transparent 42%
        ),
        #000;
}

.star{
    position:absolute;
    width:1px;
    height:1px;
    background:#fff;
    border-radius:50%;
    opacity:.15;
}

.screen{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020207;
    perspective:900px;
    perspective-origin:50% 50%;
    transform-style:preserve-3d;
}

#falling{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:visible;
    transform-style:preserve-3d;
    pointer-events:none;
}

.item{
    position:absolute;
    left:0;
    top:0;
    white-space:nowrap;
    transform-style:preserve-3d;
    will-change:transform,opacity;
    user-select:none;
    pointer-events:none;
    backface-visibility:hidden;
}

/* ==========================================================
   TEXT
   ========================================================== */

.word{
    line-height:1;
    font-weight:500;

    text-shadow:
        0 0 5px currentColor,
        0 0 12px currentColor,
        0 0 27px currentColor,
        0 0 42px rgba(255,255,255,.22);
}

.small{font-size:13px}
.medium{font-size:20px}
.big{font-size:34px}
.huge{font-size:58px}

.white{color:#eafaff}
.blue{color:#d8f7ff}
.pink{color:#ff78d9}

/* ==========================================================
   HEART
   ========================================================== */

.heart{
    font-size:38px;
    line-height:1;
    color:#ff351d;

    text-shadow:
        0 0 5px #ff3a20,
        0 0 15px #ff2415,
        0 0 32px rgba(255,55,20,.55);
}

/* ==========================================================
   PHOTO
   ========================================================== */

.photo{
    width:160px;
    height:220px;
    object-fit:contain; /* Đảm bảo giữ nguyên ratio, không bị bóp méo ảnh gốc */
    border:1px solid rgba(255,255,255,.65);
    border-radius:4px;
    background: rgba(0,0,0,0.3);

    box-shadow:
        0 0 12px rgba(255,255,255,.18),
        0 0 28px rgba(255,255,255,.08);
}

.message{
    position:absolute;
    bottom:4vh;
    left:50%;
    transform:translateX(-50%);
    z-index:50;
    width:90%;
    text-align:center;
    font-size:13px;
    opacity:.72;
    letter-spacing:1px;
    text-shadow:0 0 12px #ff45c7;
}

/* ==========================================================
   START BUTTON
   ========================================================== */

#startBtn{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:300;

    min-width:150px;
    min-height:64px;
    padding:12px 22px;

    border:1px solid rgba(255,255,255,.55);
    border-radius:18px;

    background:rgba(12,8,18,.80);
    color:#fff;

    font:600 16px/1.1 Arial,sans-serif;
    letter-spacing:.5px;

    box-shadow:0 0 28px rgba(255,90,210,.25);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
}

#startBtn span{
    display:block;
    font-size:24px;
    margin-bottom:5px;
}

#startBtn b{
    display:block;
}

#startBtn small{
    display:block;
    margin-top:5px;
    font-size:10px;
    font-weight:400;
    opacity:.68;
}

#startBtn:active{
    transform:translate(-50%,-50%) scale(.97);
}

@media (max-width:600px){
    #startBtn{
        min-width:145px;
        min-height:60px;
        border-radius:16px;
    }
}

</style>
</head>

<body>

<section id="countdown">
    <canvas id="bg-canvas"></canvas>
    <div id="countText">3</div>
</section>

<section id="birthdayScene">

    <div id="space"></div>

    <div class="screen">
        <div id="falling"></div>
    </div>

    <div class="message">
        CHỈ MONG EM LUÔN HẠNH PHÚC ❤️
    </div>

</section>

<audio id="music" src="nhac.mp3" preload="auto" loop playsinline></audio>

<button id="startBtn" type="button">
    <span>🎵</span>
    <b>BẮT ĐẦU</b>
    <small>Chạm để bật nhạc</small>
</button>

<script>

/* ==========================================================
   COUNTDOWN
   ========================================================== */

const bg=document.getElementById("bg-canvas");
const ctx=bg.getContext("2d");

let W,H,cols,drops;

const matrixText="01101001HAPPYBIRTHDAY10101";

function resizeMatrix(){

    const dpr=Math.min(devicePixelRatio||1,2);

    bg.width=innerWidth*dpr;
    bg.height=innerHeight*dpr;

    ctx.setTransform(dpr,0,0,dpr,0,0);

    W=innerWidth;
    H=innerHeight;

    cols=Math.floor(W/15);

    drops=Array(cols)
        .fill(0)
        .map(()=>Math.random()*-30);
}

resizeMatrix();
addEventListener("resize",resizeMatrix);

function matrix(){

    ctx.fillStyle="rgba(0,0,0,.13)";
    ctx.fillRect(0,0,W,H);

    ctx.font="13px monospace";

    for(let i=0;i<cols;i++){

        const ch=
            matrixText[
                (Math.random()*matrixText.length)|0
            ];

        ctx.fillStyle=
            Math.random()<.08
            ? "#fff"
            : "#ff58c8";

        ctx.fillText(
            ch,
            i*15,
            drops[i]*15
        );

        if(
            drops[i]*15>H &&
            Math.random()>.975
        ){
            drops[i]=0;
        }

        drops[i]+=.55;
    }

    requestAnimationFrame(matrix);
}

matrix();


const countText=document.getElementById("countText");

const sequence=[
    "3",
    "2",
    "1",
    "HAPPY",
    "BIRTHDAY",
    "TO",
    "CỤC TÂM ❤️"
];

let si=0;

function nextCount(){

    if(si>=sequence.length){
        startBirthday();
        return;
    }

    countText.style.animation="none";
    void countText.offsetWidth;
    countText.style.animation="pop .75s ease";

    countText.textContent=sequence[si++];

    setTimeout(
        nextCount,
        sequence[si-1].length>2
            ?850
            :900
    );
}

/* ==========================================================
   USER SETTINGS — CHỈNH TỐC ĐỘ VÀ KÍCH THƯỚC XA GẦN Ở ĐÂY
   ========================================================== */

const WORDS = [
    "Mãi xinh đẹp",
    "Luôn mỉm cười",
    "Rạng rỡ và hạnh phúc",
    "Cục Tâm ♥",
    "Yêu em",
    "Sinh nhật vui vẻ",
    "Rạng rỡ và hạnh phúc",
    "Mãi xinh đẹp",
    "Cục Tâm",
    "Luôn mỉm cười",
    "Sinh nhật vui vẻ"
];

const HEARTS = ["♥", "❤", "♡"];

const IMAGE_SOURCES = [
    "images/1.jpg",
    "images/2.jpg",
    "images/3.jpg",
    "images/4.jpg",
    "images/5.jpg",
    "images/6.jpg",
    "images/7.jpg",
    "images/8.jpg",
    "images/9.jpg"
];

const MUSIC_FILE = "nhac.mp3";

const CONFIG = {
    words: 105,
    hearts: 15,

    minZ: -500,
    maxZ: 430,

    /* 1. ĐIỀU CHỈNH TỐC ĐỘ RƠI (px/giây) */
    wordSpeed: [30, 40],   /* Tốc độ rơi của chữ [tối thiểu, tối đa] */
    heartSpeed: [30, 37], /* Tốc độ rơi của tim [tối thiểu, tối đa] */
    photoSpeed: [30, 40],  /* Tốc độ rơi của ảnh [tối thiểu, tối đa] */

    /* 2. ĐIỀU CHỈNH KÍCH THƯỚC CHỮ TỐI ĐA, TỐI THIỂU (Hiệu ứng xa, gần) */
    minWordScale: 0.4,     /* Kích thước chữ ở vị trí xa nhất */
    maxWordScale: 1,     /* Kích thước chữ ở vị trí gần nhất */

    /* 3. ĐIỀU CHỈNH KÍCH THƯỚC ẢNH TỐI ĐA, TỐI THIỂU (Hiệu ứng xa, gần) */
    minPhotoScale: 0.5,    /* Kích thước ảnh ở vị trí xa nhất */
    maxPhotoScale: 1     /* Kích thước ảnh ở vị trí gần nhất */
};

const objects = [];

function rnd(a,b){
    return a + Math.random() * (b-a);
}

function pick(arr){
    return arr[(Math.random()*arr.length)|0];
}

/* ==========================================================
   HỆ THỐNG TÍNH TOÁN KÍCH THƯỚC XA GẦN (CHIỀU SÂU Z)
   ========================================================== */

function depthInfo(z, type){
    const k = (z - CONFIG.minZ) / (CONFIG.maxZ - CONFIG.minZ);
    const n = Math.max(0, Math.min(1, k));

    let scale;
    if(type === 'photo'){
        // Tính toán scale cho ảnh dựa vào minPhotoScale và maxPhotoScale
        scale = CONFIG.minPhotoScale + Math.pow(n, 1.45) * (CONFIG.maxPhotoScale - CONFIG.minPhotoScale);
    } else {
        // Tính toán scale cho chữ/tim dựa vào minWordScale và maxWordScale
        scale = CONFIG.minWordScale + Math.pow(n, 1.45) * (CONFIG.maxWordScale - CONFIG.minWordScale);
    }

    return {
        scale: scale,
        opacity: 0.2 + n * 0.8
    };
}

/* ==========================================================
   CHỮ
   ========================================================== */

function addWord(){
    const e = document.createElement("div");
    const r = Math.random();

    let sizeClass;
    if(r < .035) sizeClass = "huge";
    else if(r < .22) sizeClass = "big";
    else if(r < .72) sizeClass = "medium";
    else sizeClass = "small";

    const colorClass =
        Math.random() < .18
        ? "pink"
        : Math.random() < .5
            ? "blue"
            : "white";

    e.className = "item word " + sizeClass + " " + colorClass;
    e.textContent = pick(WORDS);

    falling.appendChild(e);

    const o = {
        e,
        type: "word",
        x: rnd(-12,112),
        y: rnd(-115,108),
        z: rnd(CONFIG.minZ, CONFIG.maxZ),
        speed: rnd(...CONFIG.wordSpeed),
        drift: rnd(-2.5,2.5),
        phase: rnd(0,Math.PI*2),
        rx: rnd(-3.5,3.5),
        ry: rnd(-7,7),
        rz: rnd(-4,4),
        alpha: rnd(.75,1)
    };

    o.depth = depthInfo(o.z, 'word');
    objects.push(o);
}

/* ==========================================================
   TIM
   ========================================================== */

function addHeart(){
    const e = document.createElement("div");
    e.className = "item heart";
    e.textContent = pick(HEARTS);

    falling.appendChild(e);

    const o = {
        e,
        type: "heart",
        x: rnd(-10,110),
        y: rnd(-125,108),
        z: rnd(CONFIG.minZ, CONFIG.maxZ),
        speed: rnd(...CONFIG.heartSpeed),
        drift: rnd(-3,3),
        phase: rnd(0,Math.PI*2),
        rx: rnd(-4,4),
        ry: rnd(-8,8),
        rz: rnd(-5,5),
        alpha: rnd(.8,1)
    };

    o.depth = depthInfo(o.z, 'heart');
    objects.push(o);
}

/* ==========================================================
   ẢNH (HỖ TRỢ RƠI LẶP LẠI & GIỮ TỶ LỆ GỐC)
   ========================================================== */

function addPhoto(src){
    const e = document.createElement("img");
    e.className = "item photo";
    e.src = src;
    e.alt = "";

    e.onerror = () => e.remove();

    falling.appendChild(e);

    const o = {
        e,
        type: "photo",
        x: rnd(4,88),
        y: rnd(-135,108),
        z: rnd(CONFIG.minZ, CONFIG.maxZ),
        speed: rnd(...CONFIG.photoSpeed),
        drift: rnd(-1.8,1.8),
        phase: rnd(0,Math.PI*2),
        rx: rnd(-2.5,2.5),
        ry: rnd(-5,5),
        rz: rnd(-2.5,2.5),
        alpha: rnd(.82,1)
    };

    o.depth = depthInfo(o.z, 'photo');
    objects.push(o);
}

/* Khởi tạo các đối tượng */
for(let i=0; i<CONFIG.words; i++){
    addWord();
}

for(let i=0; i<CONFIG.hearts; i++){
    addHeart();
}

// Thêm các ảnh lặp lại ngẫu nhiên từ danh sách IMAGE_SOURCES để tạo hiệu ứng rơi phong phú
for(let i=0; i<15; i++){
    addPhoto(pick(IMAGE_SOURCES));
}

/* ==========================================================
   RECYCLE — TÁI SỬ DỤNG KHI RƠI XUỐNG ĐÁY (LẶP LẠI LIÊN TỤC)
   ========================================================== */

function recycle(o){
    o.y = rnd(-145,-25);
    o.x = rnd(-12,112);
    o.z = rnd(CONFIG.minZ, CONFIG.maxZ);

    if(o.type === "word"){
        o.depth = depthInfo(o.z, 'word');
        o.speed = rnd(...CONFIG.wordSpeed);
        o.drift = rnd(-2.5,2.5);
        o.alpha = rnd(.72,1);
    }
    else if(o.type === "heart"){
        o.depth = depthInfo(o.z, 'heart');
        o.speed = rnd(...CONFIG.heartSpeed);
        o.drift = rnd(-3,3);
        o.alpha = rnd(.82,1);
    }
    else{
        o.depth = depthInfo(o.z, 'photo');
        o.speed = rnd(...CONFIG.photoSpeed);
        o.drift = rnd(-1.8,1.8);
        o.alpha = rnd(.82,1);
    }
}

/* ==========================================================
   ANIMATION
   ========================================================== */

let last = performance.now();

function animate(t){
    const dt = Math.min(.032, (t-last)/1000);
    last = t;

    for(const o of objects){
        o.y += o.speed * dt;

        o.x +=
            Math.sin(t*.00065 + o.phase) *
            o.drift * dt;

        const d = o.depth;

        const x = o.x/100 * falling.clientWidth;
        const y = o.y/100 * falling.clientHeight;

        o.e.style.opacity = o.alpha * d.opacity;

        o.e.style.transform = `
            translate3d(${x}px,${y}px,${o.z}px)
            translate(-50%,-50%)
            rotateX(${o.rx}deg)
            rotateY(${o.ry}deg)
            rotateZ(${o.rz}deg)
            scale(${d.scale})
        `;

        if(o.y > 120){
            recycle(o);
        }
    }

    requestAnimationFrame(animate);
}

function buildScene(){
    const space = document.getElementById("space");
    if(space.dataset.ready) return;
    space.dataset.ready = "1";

    for(let i=0; i<95; i++){
        const s = document.createElement("i");
        s.className = "star";
        s.style.left = Math.random()*100 + "%";
        s.style.top = Math.random()*100 + "%";
        s.style.opacity = rnd(.10,.42);
        space.appendChild(s);
    }
}

function startBirthday(){
    document.getElementById("countdown").style.display = "none";
    birthdayScene.style.display = "flex";
    buildScene();
    last = performance.now();
    requestAnimationFrame(animate);
}

const music = document.getElementById("music");
const startBtn = document.getElementById("startBtn");

music.src = MUSIC_FILE;

let started = false;

async function startExperience(){
    if(started) return;
    started = true;

    music.volume = .72;

    try{
        await music.play();
    }
    catch(err){
        console.warn("Audio playback blocked:", err);
    }

    startBtn.style.display = "none";
    nextCount();
}

startBtn.addEventListener("click", startExperience, {passive:true});
startBtn.addEventListener("touchend", e=>{
    e.preventDefault();
    startExperience();
}, {passive:false});

</script>
</body>
</html>
